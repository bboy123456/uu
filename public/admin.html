<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>访问数据</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; color: #202124; background: #f6f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-box { width: min(360px, 100%); background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 28px; box-shadow: 0 8px 24px #0000000a; }
    h1 { margin: 0 0 22px; font-size: 22px; }
    label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
    input { width: 100%; height: 42px; border: 1px solid #bbb; border-radius: 6px; padding: 0 12px; outline: none; }
    input:focus { border-color: #1667d9; box-shadow: 0 0 0 3px #1667d91a; }
    button { height: 38px; border: 0; border-radius: 6px; padding: 0 15px; cursor: pointer; background: #1667d9; color: white; }
    .login button { width: 100%; margin-top: 14px; }
    .error { min-height: 20px; margin: 10px 0 0; color: #c5221f; font-size: 13px; }
    .dashboard { display: none; }
    header { height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(16px, 4vw, 48px); background: #fff; border-bottom: 1px solid #ddd; }
    header strong { font-size: 18px; }
    header button { background: #fff; color: #444; border: 1px solid #ccc; }
    main { max-width: 1440px; margin: auto; padding: 28px clamp(12px, 4vw, 48px); }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 18px; }
    .stat span { display: block; color: #666; font-size: 13px; margin-bottom: 8px; }
    .stat b { font-size: 28px; }
    .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .toolbar input { max-width: 300px; background: #fff; }
    .table-wrap { overflow: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 13px; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #eee; }
    th { position: sticky; top: 0; background: #fafafa; color: #555; font-weight: 600; }
    tbody tr:last-child td { border-bottom: 0; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: #aaa; }
    .dot.online { background: #1e8e3e; box-shadow: 0 0 0 3px #1e8e3e1a; }
    .empty { padding: 40px; text-align: center; color: #777; }
    @media (max-width: 620px) { .stats { grid-template-columns: 1fr; } main { padding-top: 16px; } .toolbar { align-items: stretch; flex-direction: column; } .toolbar input { max-width: none; } }
  </style>
</head>
<body>
  <section class="login" id="login">
    <form class="login-box" id="loginForm">
      <h1>访问数据后台</h1>
      <label for="password">管理密码</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">登录</button>
      <p class="error" id="error"></p>
    </form>
  </section>
  <section class="dashboard" id="dashboard">
    <header><strong>访问数据</strong><button id="logout">退出</button></header>
    <main>
      <div class="stats">
        <div class="stat"><span>访问次数</span><b id="total">0</b></div>
        <div class="stat"><span>匿名设备数</span><b id="unique">0</b></div>
        <div class="stat"><span>当前在线</span><b id="online">0</b></div>
      </div>
      <div class="toolbar"><input id="search" type="search" placeholder="搜索设备 ID、系统或浏览器"><span id="updated"></span></div>
      <div class="table-wrap"><table><thead><tr><th>状态</th><th>进入时间</th><th>停留时长</th><th>设备标识</th><th>设备</th><th>系统 / 浏览器</th><th>屏幕</th><th>地区设置</th><th>来源</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">暂无访问记录</div></div>
    </main>
  </section>
  <script src="/admin.js"></script>
</body>
</html>
