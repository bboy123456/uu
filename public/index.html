<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>加载中</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #fff; }
    .spinner { width: 34px; height: 34px; border: 3px solid #e7e7e7; border-top-color: #777; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) { body { background: #111; } .spinner { border-color: #333; border-top-color: #aaa; } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.8s; } }
  </style>
</head>
<body>
  <div class="spinner" role="status" aria-label="加载中"></div>
  <script src="/app.js"></script>
</body>
</html>
